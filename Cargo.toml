[package]
name = "esp32-luanti"
version = "0.1.0"
authors = ["Keir Finlow-Bates <keir@chainfrog.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
description = "A minimal Luanti (Minetest) server for the ESP32-S3"
license = "MIT"
readme = "README.md"

[[bin]]
name = "esp32-luanti"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf.git" }

[dependencies]
log = "0.4"
esp-idf-svc = "0.53"
anyhow = "1"

[build-dependencies]
embuild = "0.33.5"
